name: Conformance

# Runs the official inertiajs/inertia Playwright suite, unmodified, against the
# adapter (see conformance/README.md).
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      inertia_ref:
        description: 'inertiajs/inertia ref to test against (default: the pinned release)'
        required: false
      baseline:
        description: 'Triage: run against upstream''s own helpers.js instead of the adapter'
        type: boolean
        default: false
      playwright_args:
        description: 'Triage: extra Playwright arguments, e.g. "tests/links.spec.ts:910 --repeat-each=5"'
        required: false

permissions:
  contents: read

jobs:
  conformance:
    name: Official suite · ${{ matrix.framework }}
    # Upstream v3.11.0 pins Playwright 1.58, which can't install browsers on
    # Ubuntu 26.04 (today's ubuntu-latest). Move on when the pin is bumped.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        framework: [react, vue3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # PLAYWRIGHT_ARGS is word-split on purpose (it's a list of arguments).
      - run: conformance/run.sh ${{ matrix.framework }} $PLAYWRIGHT_ARGS
        env:
          PLAYWRIGHT_ARGS: ${{ inputs.playwright_args }}
          CI: 'true'
          INERTIA_REF: ${{ inputs.inertia_ref }}
          CONFORMANCE_BASELINE: ${{ inputs.baseline && '1' || '' }}
