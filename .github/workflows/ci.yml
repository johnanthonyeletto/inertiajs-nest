name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package · Node ${{ matrix.node }} · Nest ${{ matrix.nest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        nest: [latest, '12.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Workspace manifests ask for the latest Nest, so the older minor has to be
      # pinned there (a root-level install would be shadowed by the workspace's
      # own nested copy).
      - name: Install the lowest supported Nest minor
        if: matrix.nest != 'latest'
        run: |
          for p in common core platform-express testing; do
            npm pkg set "devDependencies.@nestjs/$p=${{ matrix.nest }}" -w inertia-nest
          done
          for p in common core platform-express; do
            npm pkg set "dependencies.@nestjs/$p=${{ matrix.nest }}" -w demo
          done
          npm install --no-audit --no-fund
      - name: Check the Nest version under test
        working-directory: packages/nestjs-inertia
        run: |
          version=$(node -e "const p=require('path').dirname(require.resolve('@nestjs/core'));let d=p;while(!require('fs').existsSync(d+'/package.json'))d=require('path').dirname(d);console.log(JSON.parse(require('fs').readFileSync(d+'/package.json','utf8')).version)")
          echo "Testing against @nestjs/core $version"
          case "${{ matrix.nest }}" in latest) ;; *) [[ "$version" == ${{ matrix.nest }}.* ]] || { echo "expected ${{ matrix.nest }}.x"; exit 1; } ;; esac
      - run: npm run typecheck -w inertia-nest
      - run: npm run build -w inertia-nest
      - run: npm test
      - name: Check the published file list
        run: npm pack --dry-run -w inertia-nest

  demo:
    name: Demo browser suite · ${{ matrix.mode }}
    runs-on: ubuntu-latest
    needs: package
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, production]
    env:
      PORT: 3000
      BASE: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/demo
      - run: npm run build -w inertia-nest
      - run: npm run typecheck -w demo
      - run: npm run db:fresh -w demo

      - name: Start (dev)
        if: matrix.mode == 'dev'
        run: |
          npm run dev -w demo > dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "$BASE/login" > /dev/null && [ -f apps/demo/public/hot ] && exit 0
            sleep 2
          done
          cat dev.log; exit 1

      - name: Start (production)
        if: matrix.mode == 'production'
        run: |
          npm run build -w demo
          npm run start:ssr -w demo > ssr.log 2>&1 &
          npm run start -w demo > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$BASE/login" > /dev/null && npm run check:ssr -w demo && exit 0
            sleep 2
          done
          cat app.log ssr.log; exit 1

      - run: npm run test:browser
      - name: Server logs
        if: failure()
        run: cat dev.log app.log ssr.log 2>/dev/null || true
