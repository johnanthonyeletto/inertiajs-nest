name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package · Node ${{ matrix.node }} · Nest ${{ matrix.nest }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        nest: [latest, '12.0']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace manifests ask for the latest Nest, so the older minor has to be
      # pinned in each workspace that depends on it.
      - name: Install the lowest supported Nest minor
        if: matrix.nest != 'latest'
        run: |
          v='${{ matrix.nest }}'
          pnpm --filter @johnanthonyeletto/nestjs-inertia add -D "@nestjs/common@$v" "@nestjs/core@$v" "@nestjs/platform-express@$v" "@nestjs/testing@$v"
          pnpm --filter demo add "@nestjs/common@$v" "@nestjs/core@$v" "@nestjs/platform-express@$v"
      - name: Check the Nest version under test
        working-directory: packages/nestjs-inertia
        run: |
          version=$(node -e "const p=require('path').dirname(require.resolve('@nestjs/core'));let d=p;while(!require('fs').existsSync(d+'/package.json'))d=require('path').dirname(d);console.log(JSON.parse(require('fs').readFileSync(d+'/package.json','utf8')).version)")
          echo "Testing against @nestjs/core $version"
          case "${{ matrix.nest }}" in latest) ;; *) [[ "$version" == ${{ matrix.nest }}.* ]] || { echo "expected ${{ matrix.nest }}.x"; exit 1; } ;; esac
      - run: pnpm --filter @johnanthonyeletto/nestjs-inertia typecheck
      - run: pnpm --filter @johnanthonyeletto/nestjs-inertia build
      - run: pnpm test
      - name: Check the published file list
        run: pnpm --filter @johnanthonyeletto/nestjs-inertia pack --dry-run

  demo:
    name: Demo browser suite · ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: package
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, production]
    env:
      PORT: 3000
      BASE: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/demo
      - run: pnpm --filter @johnanthonyeletto/nestjs-inertia build
      - run: pnpm --filter demo typecheck
      - run: pnpm --filter demo db:fresh

      # The Vite dev server (HMR assets, SSR through /__inertia_ssr) next to a
      # one-off server build: `pnpm dev`'s watchers restart the server while
      # their first builds finish, which races the readiness check.
      - name: Start (dev)
        if: matrix.mode == 'dev'
        working-directory: apps/demo
        run: |
          pnpm build:server
          pnpm exec vite > ../../vite.log 2>&1 &
          node --enable-source-maps dist/main.js > ../../dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "$BASE/login" > /dev/null && [ -f public/hot ] && exit 0
            sleep 2
          done
          cat ../../dev.log ../../vite.log; exit 1

      - name: Start (production)
        if: matrix.mode == 'production'
        run: |
          pnpm --filter demo build
          pnpm --filter demo start:ssr > ssr.log 2>&1 &
          pnpm --filter demo start > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$BASE/login" > /dev/null && pnpm --filter demo check:ssr && exit 0
            sleep 2
          done
          cat app.log ssr.log; exit 1

      - run: pnpm test:browser
      - name: Server logs
        if: failure()
        run: cat dev.log vite.log app.log ssr.log 2>/dev/null || true
